<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Educational digital signature and document verification system">
<title>History | SignVerify</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<h1>Activity History</h1>
<p class="lead">An audit trail of key generation, signing and verification. Only file names and hashes are stored. Documents and private keys are never saved.</p>
<div class="card table-wrap">
  <table>
    <thead><tr><th>Time</th><th>Action</th><th>File</th><th>Result</th><th>Details</th></tr></thead>
    <tbody id="history-body"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
  </table>
</div>
<dialog id="detail-dialog" aria-labelledby="detail-title">
  <h2 id="detail-title">Record details</h2>
  <div id="detail-body"></div>
  <div class="btn-row"><button class="btn secondary" id="close-dialog">Close</button></div>
</dialog>
</main>
<footer id="site-footer"></footer>
<script src="js/main.js"></script>
<script src="js/history.js"></script>
</body>
</html>
